spring:
  kafka:
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      # Use JsonSerializer to convert the Transaction object to JSON bytes
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
    consumer:
      group-id: midas-core-group
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      # Use JsonDeserializer to convert JSON bytes back into a Transaction object
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        # Trust the package where your Transaction class is located
        spring.json.trusted.packages: "com.jpmc.midascore.foundation"
  datasource:
    # This names the database so the H2 console can find it
    url: jdbc:h2:mem:testdb
    driver-class-name: org.h2.Driver
    username: sa
    password:
  h2:
    console:
      # Enables the web interface at /h2-console
      enabled: true
      # Ensures the database name is consistent
      settings:
        web-allow-others: true
  jpa:
    # Helps with debugging by showing SQL in logs
    show-sql: true
    hibernate:
      ddl-auto: update

# Keep your existing general configuration
General:
  kafka-topic: trader-updates

server:
  port: 33400